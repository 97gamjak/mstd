# DevOps Configuration File

[exclude]
buggy_cpp_macros = ["MSTD_WARN_BUGGY_HEADER", "MSTD_WARN_BUGGY_LIBRARY"]

[logging]
#global_level = "INFO"
#utils_level = "INFO"
#config_level = "INFO"
#cpp_level = "INFO"

[git]
#tag_prefix = ""
#empty_tag_list_allowed = true

[cpp]
#style_checks = true
#license_header_check = true
#check_only_staged_files = false
license_header = "config/licenseHeader.txt"
header_guards_according_to_filepath = true
ast_check_compile_args = ["-std=c++23", "-Iinclude"]
ast_check_compile_commands_db = "build"
# The entire quantity/ module is marked buggy (MSTD_WARN_BUGGY_HEADER) and
# not usable; libclang chokes while parsing its intentionally-broken
# content, so exclude it from AST-based checks like the rest of the
# toolchain already treats it as off-limits.
exclude_dirs = ["quantity"]

[file]
#encoding = "utf-8"
